# Ikon launcher dari assets/brand. Ganti PNG-nya lalu `just icons`.
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  adaptive_icon_background: "#18181b"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_foreground.png
  min_sdk_android: 24
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#18181b"
